services:
  krusch-companion:
    build:
      context: ../..
      dockerfile: projects/krusch-companion/Dockerfile
    container_name: krusch-companion
    restart: unless-stopped
    ports:
      - "3004:3004"
    volumes:
      - ./data:/app/projects/krusch-companion/data
    environment:
      - NODE_ENV=production
      - PORT=3004
      - OLLAMA_HOST=http://host.docker.internal:11434
      - SWARM_VLLM_URL=http://host.docker.internal:8000/v1
      - ALLOW_CLOUD_ESCALATION=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
