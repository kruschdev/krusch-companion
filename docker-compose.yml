services:
  krusch-companion:
    build:
      context: ../..
      dockerfile: projects/krusch-companion/Dockerfile
    container_name: krusch-companion
    restart: unless-stopped
    ports:
      - "3004:3004"
    volumes:
      - ./data:/app/projects/krusch-companion/data
    environment:
      - NODE_ENV=production
      - PORT=3004
      - OLLAMA_HOST=http://krusch:11434
      - SWARM_VLLM_URL=http://kruschdev:8000/v1
      - ALLOW_CLOUD_ESCALATION=false
    extra_hosts:
      - "krusch:100.65.159.15"
      - "kruschdev:100.106.193.66"
